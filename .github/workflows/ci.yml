name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Confirm the pure-Python engine gives identical results off-Linux.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no optional extras, so the zero-dependency path is tested)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov=danioprime --cov-report=term-missing

      - name: Example data is reproducible
        shell: bash
        run: |
          # $RUNNER_TEMP works on Linux, macOS and Windows runners alike.
          cd examples
          cp kcnh6a_locus.fa "$RUNNER_TEMP/before.fa"
          python make_example_data.py
          diff -q "$RUNNER_TEMP/before.fa" kcnh6a_locus.fa

      - name: CLI smoke test
        shell: bash
        run: |
          danioprime --version
          danioprime info
          danioprime presets
          danioprime genotype \
            --template examples/kcnh6a_locus.fa \
            --protospacer AAGCCCTGTTATGTGCAACG \
            --avoid examples/kcnh6b_locus.fa \
            --preset genotyping-gel --show 2

  web-build:
    name: browser build (wheel freshness + Pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: The wheel committed for the browser must match src/
        run: python web/check_wheel.py

      - name: Install the Pyodide version the page is pinned to
        run: |
          VERSION=$(node web/pyodide_version.mjs)
          echo "index.html pins Pyodide $VERSION"
          npm init -y > /dev/null
          npm install --silent "pyodide@$VERSION"

      - name: Every web mode runs under CPython-on-WebAssembly
        run: node web/smoke.mjs

  primer3-backend:
    name: optional primer3 backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the primer3 extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,primer3]"
      - name: Test, including the primer3-gated cases
        run: pytest -q
      - name: Both backends agree on a design
        run: |
          danioprime design --template examples/kcnh6a_locus.fa --preset qpcr \
            --thermo-backend builtin --format tsv --out builtin.tsv
          danioprime design --template examples/kcnh6a_locus.fa --preset qpcr \
            --thermo-backend primer3 --format tsv --out primer3.tsv
          echo "--- builtin ---"; head -3 builtin.tsv
          echo "--- primer3 ---"; head -3 primer3.tsv

  external-aligners:
    name: optional blastn backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BLAST+
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: blastn is detected and agrees with the built-in scanner
        run: |
          danioprime info | grep -E 'blastn\s+/'
          python - <<'PY'
          from danioprime.sequence import read_single_fasta
          from danioprime.specificity.external import blastn_sites
          from danioprime.specificity.scan import find_binding_sites
          import subprocess, tempfile, os

          rec = read_single_fasta("examples/kcnh6b_locus.fa")
          tmp = tempfile.mkdtemp()
          db = os.path.join(tmp, "db")
          subprocess.run(
              ["makeblastdb", "-in", "examples/kcnh6b_locus.fa", "-dbtype", "nucl", "-out", db],
              check=True, capture_output=True,
          )
          primer = rec.seq[1500:1520]
          external = blastn_sites({"p": primer}, db)["p"]
          builtin = find_binding_sites(primer, rec, primer_name="p")
          ext_perfect = {(s.start, s.strand) for s in external if s.mismatches == 0}
          own_perfect = {(s.start, s.strand) for s in builtin if s.mismatches == 0}
          assert own_perfect, "built-in scanner found no perfect site"
          assert ext_perfect, "blastn found no perfect site for a primer taken from the subject"
          assert own_perfect & ext_perfect, (
              f"no shared perfect site: blastn {ext_perfect} vs builtin {own_perfect}"
          )
          print("both backends agree on perfect site(s):", sorted(own_perfect & ext_perfect))
          PY
